name: Sinopia
options:
  bundleIdPrefix: com.sinopialeaf
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.2'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  Alamofire:
    url: https://github.com/rg8tv2gc29-tech/Alamofire
    revision: 8a974e1e0961fe3134df593e2d7d67db3d4c2ad3
  SinopiaCore:
    path: Packages/SinopiaCore
  OneSignal:
    url: https://github.com/OneSignal/OneSignal-XCFramework
    from: 5.5.0
targets:
  Sinopia:
    type: application
    platform: iOS
    sources:
    - path: Sinopia
    resources:
    - path: PrivacyInfo.xcprivacy
    dependencies:
    - package: SinopiaCore
    - package: Alamofire
    - package: OneSignal
      product: OneSignalFramework
    - package: OneSignal
      product: OneSignalInAppMessages
    - target: OneSignalNotificationServiceExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sinopialeaf.press
        PRODUCT_NAME: Sinopia
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: 'NO'
        INFOPLIST_KEY_CFBundleDisplayName: Sinopia
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: 'YES'
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSCameraUsageDescription: This app does not use the camera.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1,2
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: 'NO'
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: 'NO'
        CURRENT_PROJECT_VERSION: 10
        MARKETING_VERSION: 1.3
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Support/Sinopia-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/Sinopia.entitlements
  SinopiaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - path: SinopiaTests
    dependencies:
    - target: Sinopia
    - package: SinopiaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sinopialeaf.press.tests
        GENERATE_INFOPLIST_FILE: 'YES'
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        SWIFT_VERSION: '6.2'
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Sinopia.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Sinopia
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
  OneSignalNotificationServiceExtension:
    type: app-extension
    platform: iOS
    sources:
    - path: OneSignalNotificationServiceExtension
    dependencies:
    - package: OneSignal
      product: OneSignalExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sinopialeaf.press.OneSignalNotificationServiceExtension
        PRODUCT_NAME: OneSignalNotificationServiceExtension
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_FILE: Support/OneSignalNotificationServiceExtension-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: OneSignalNotificationServiceExtension
        CODE_SIGN_ENTITLEMENTS: Support/OneSignalNotificationServiceExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        SWIFT_VERSION: '5.0'
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: 1,2
        SKIP_INSTALL: 'YES'
        MARKETING_VERSION: 1.3
        CURRENT_PROJECT_VERSION: 10
schemes:
  Sinopia:
    build:
      targets:
        Sinopia: all
        SinopiaTests:
        - test
    test:
      targets:
      - SinopiaTests
